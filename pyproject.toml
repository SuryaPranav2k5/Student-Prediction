[project]
name = "prediction"
version = "1.0.0"
description = "OULAD student at-risk prediction at week 4 / 8 / 12 checkpoints"
readme = "README.md"
authors = [
    { name = "Surya Pranav", email = "pranavsurya123@gmail.com" }
]
requires-python = ">=3.11"

# Runtime + evaluation dependencies. Versions are minimum-floor pinned so the
# project installs reproducibly; the working environment used for all reported
# numbers is captured in uv.lock.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
    "joblib>=1.3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "streamlit>=1.30",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
# Scripts are run directly from the repo root (python features/build_features.py,
# python models/train.py, ...). This entry point is a convenience only.
prediction = "prediction:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
